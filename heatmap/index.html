<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heatmap - Mold Konomi</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .heatmap-large {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }
    .wing-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .wing-title {
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .floor-row-large {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      align-items: center;
    }
    .floor-label-large {
      width: 2.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .unit-cell-large {
      width: 2rem;
      height: 2rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.625rem;
      font-weight: 600;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .unit-cell-large:hover {
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      z-index: 10;
    }
    .unit-cell-large[data-severity="0"] { background: var(--severity-none); opacity: 0.4; }
    .unit-cell-large[data-severity="1"] { background: var(--severity-minor); color: #000; }
    .unit-cell-large[data-severity="2"] { background: var(--severity-moderate); color: #000; }
    .unit-cell-large[data-severity="3"] { background: var(--severity-severe); color: #fff; }
    .unit-cell-large[data-severity="4"] { background: var(--severity-critical); color: #fff; }

    .legend {
      display: flex;
      gap: 1rem;
      justify-content: center;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: var(--radius);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }
    .legend-color {
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 4px;
    }

    .view-toggle {
      display: flex;
      gap: 0.5rem;
      background: var(--bg-hover);
      padding: 4px;
      border-radius: var(--radius);
    }
    .view-toggle button {
      padding: 0.5rem 1rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 4px;
    }
    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../" class="nav-logo">🦠 Mold Konomi</a>
    <ul class="nav-links">
      <li><a href="../">Dashboard</a></li>
      <li><a href="../unit/">Units</a></li>
      <li><a href="../zone/">Zones</a></li>
      <li><a href="./" class="active">Heatmap</a></li>
      <li><a href="../schedule/">Schedule</a></li>
      <li><a href="../reports/">Reports</a></li>
    </ul>
    <div class="nav-status">
      <span class="status-dot disconnected"></span>
      <span id="connection-status">Connecting...</span>
    </div>
  </nav>

  <div class="container">
    <div class="page-header flex flex-between flex-center">
      <div>
        <h1 class="page-title">Severity Heatmap</h1>
        <p class="page-subtitle">Visual overview of all 176 units</p>
      </div>
      <div class="view-toggle">
        <button class="active" onclick="setView('severity')">Severity</button>
        <button onclick="setView('moisture')">Moisture</button>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend mb-2">
      <div class="legend-item">
        <div class="legend-color" style="background: var(--severity-none); opacity: 0.4;"></div>
        <span>None (0)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--severity-minor);"></div>
        <span>Minor (1)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--severity-moderate);"></div>
        <span>Moderate (2)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--severity-severe);"></div>
        <span>Severe (3)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--severity-critical);"></div>
        <span>Critical (4)</span>
      </div>
    </div>

    <!-- Heatmap Grid -->
    <div id="heatmap-container" class="heatmap-large">
      <div class="loading" style="grid-column: 1/-1;"><div class="spinner"></div></div>
    </div>

    <!-- Floor Summary -->
    <div class="card mt-2">
      <div class="card-header">
        <span class="card-title">📊 Floor Summary</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Floor</th>
              <th>Total Units</th>
              <th>Affected</th>
              <th>Avg Severity</th>
              <th>Max Severity</th>
              <th>Critical</th>
              <th>Severe</th>
            </tr>
          </thead>
          <tbody id="floor-summary-table">
            <tr><td colspan="7" class="text-center"><div class="loading"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Unit Tooltip -->
    <div id="unit-tooltip" style="display: none; position: fixed; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; z-index: 1000; pointer-events: none; box-shadow: var(--shadow);">
      <div id="tooltip-content"></div>
    </div>
  </div>

  <script src="../assets/js/mold-konomi.js"></script>
  <script>
    let heatmapData = null;
    let currentView = 'severity';

    async function init() {
      await loadHeatmap();

      // Setup WebSocket for real-time updates
      MoldKonomi.wsSubscribe('updates', () => {
        loadHeatmap();
      });
    }

    async function loadHeatmap() {
      try {
        heatmapData = await MoldKonomi.getHeatmap();
        renderHeatmap();
        renderFloorSummary();
      } catch (error) {
        document.getElementById('heatmap-container').innerHTML =
          `<div class="alert alert-critical" style="grid-column: 1/-1;">${error.message}</div>`;
      }
    }

    function renderHeatmap() {
      const container = document.getElementById('heatmap-container');
      const { severity_matrix, moisture_matrix, floors, wings } = heatmapData;
      const unitsPerWing = severity_matrix[0]?.[0]?.length || 11;
      const matrix = currentView === 'severity' ? severity_matrix : moisture_matrix;

      let html = '';

      wings.forEach((wingName, wingIndex) => {
        html += `<div class="wing-block">
          <div class="wing-title">
            <span>${wingName} Wing</span>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${unitsPerWing * floors} units</span>
          </div>`;

        for (let f = floors - 1; f >= 0; f--) {
          html += `<div class="floor-row-large">
            <span class="floor-label-large">Floor ${f}</span>`;

          for (let u = 0; u < unitsPerWing; u++) {
            let value, displayValue;
            if (currentView === 'severity') {
              value = severity_matrix[f]?.[wingIndex]?.[u] || 0;
              displayValue = value;
            } else {
              value = moisture_matrix[f]?.[wingIndex]?.[u] || 0;
              // Convert moisture to severity-like scale for coloring
              displayValue = Math.round(value * 100);
              value = Math.min(4, Math.floor(value * 5));
            }

            const unitId = MoldKonomi.makeUnitId(f, wingName, u);
            html += `<div class="unit-cell-large"
                         data-severity="${value}"
                         data-unit-id="${unitId}"
                         data-floor="${f}"
                         data-wing="${wingName}"
                         data-unit="${u}"
                         onmouseenter="showTooltip(event, '${unitId}')"
                         onmouseleave="hideTooltip()"
                         onclick="goToUnit('${unitId}')">${currentView === 'severity' ? '' : ''}</div>`;
          }

          html += '</div>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
    }

    function renderFloorSummary() {
      const tbody = document.getElementById('floor-summary-table');
      const summaries = heatmapData.floor_summaries || [];

      const rows = summaries.map(floor => `
        <tr>
          <td><strong>Floor ${floor.floor}</strong></td>
          <td>${floor.total_units}</td>
          <td>${floor.affected_units}</td>
          <td>${floor.avg_severity.toFixed(2)}</td>
          <td>${MoldKonomi.severityBadge(floor.max_severity)}</td>
          <td style="color: var(--severity-critical);">${floor.critical_count}</td>
          <td style="color: var(--severity-severe);">${floor.severe_count}</td>
        </tr>
      `).join('');

      tbody.innerHTML = rows || '<tr><td colspan="7">No data</td></tr>';
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('.view-toggle button').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === view);
      });
      renderHeatmap();
    }

    function showTooltip(event, unitId) {
      const tooltip = document.getElementById('unit-tooltip');
      const content = document.getElementById('tooltip-content');
      const cell = event.target;

      const floor = cell.dataset.floor;
      const wing = cell.dataset.wing;
      const unit = cell.dataset.unit;
      const severity = heatmapData.severity_matrix[floor]?.[MoldKonomi.WINGS.indexOf(wing)]?.[unit] || 0;
      const moisture = heatmapData.moisture_matrix[floor]?.[MoldKonomi.WINGS.indexOf(wing)]?.[unit] || 0;

      content.innerHTML = `
        <div style="font-weight: 600; margin-bottom: 0.5rem;">Unit ${unitId}</div>
        <div style="font-size: 0.875rem;">
          <div>Severity: ${MoldKonomi.severityBadge(severity)}</div>
          <div style="margin-top: 0.25rem;">Moisture: ${(moisture * 100).toFixed(0)}%</div>
        </div>
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">Click to view details</div>
      `;

      tooltip.style.display = 'block';
      tooltip.style.left = (event.clientX + 10) + 'px';
      tooltip.style.top = (event.clientY + 10) + 'px';
    }

    function hideTooltip() {
      document.getElementById('unit-tooltip').style.display = 'none';
    }

    function goToUnit(unitId) {
      window.location.href = `../unit/?id=${unitId}`;
    }

    // Globals
    window.setView = setView;
    window.showTooltip = showTooltip;
    window.hideTooltip = hideTooltip;
    window.goToUnit = goToUnit;

    // Start
    init();
  </script>
</body>
</html>
